# Cloudflare Worker — cron pinger that drives Ripple's scheduled jobs.
#
# This config lives at the repo root so Cloudflare Workers Builds (which builds
# from the repository root) can find it and deploy on push. The worker source
# stays under workers/cloudflare/src; `main` is resolved relative to this file.
#
# Secret (set once in the dashboard or via `wrangler secret put`):
#   CRON_SECRET  → must match the value in Vercel (Bearer auth for /api/cron/*)
name = "ripple"
main = "workers/cloudflare/src/index.ts"
compatibility_date = "2024-11-01"

[vars]
APP_URL = "https://ripple-cs153.vercel.app"

# Cron Triggers are intentionally NOT declared here.
#
# The git-connected Cloudflare Workers Build cannot register cron schedules on
# deploy (the script uploads fine, but the /schedules API call fails on the CI
# deploy path), which marked every build as failed. Omitting `[triggers]` makes
# `wrangler deploy` skip the schedules call entirely and LEAVE EXISTING TRIGGERS
# IN PLACE (per Cloudflare docs), so CI builds stay green and the schedules set
# in the dashboard persist across deploys.
#
# Set these two triggers ONCE in the dashboard (Worker → Settings → Triggers →
# Cron Triggers). The scheduled() handler in src/index.ts dispatches on exactly
# these expressions:
#   */15 * * * *   scenario queue drain
#   0 * * * *      hourly: snapshot (2h) · stories (4h) · ingest (6h) · daily (12:00 UTC)
